/**:
  ros__parameters:
    # Line follow parameters
    base_speed: 0.15
    max_speed: 0.3
    kp_lateral: 3.0
    kd_lateral: 0.5

    # Return home parameters
    max_home_speed: 0.2
    kp_distance: 0.8
    kp_yaw: 1.5
    target_tolerance: 0.05   # meters
    yaw_tolerance: 0.05      # radians

    # State machine
    stop_delay: 5.0           # seconds in STOPPED before IDLE
